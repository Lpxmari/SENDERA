# Perfil de pruebas: H2 en memoria con esquema generado desde las entidades. No requiere MySQL ni variables de entorno.
spring:
  datasource:
    url: jdbc:h2:mem:sendera;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  jwt:
    secret: clave-de-pruebas-con-mas-de-treinta-y-dos-caracteres
