openapi: 3.0.3
info:
  title: API REST - Proyecto SENDERA
  description: Contrato de interfaz OpenAPI para la integración entre Frontend (React + TS) y Backend (Spring Boot) del proyecto SENDERA.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Servidor de Desarrollo Local

paths:

  /destinos:
    get:
      summary: Obtener lista de destinos turísticos
      operationId: listarDestinos
      tags:
        - Destinos
      responses:
        '200':
          description: Lista de destinos obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Destino'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    post:
      summary: Crear un nuevo destino turístico
      operationId: crearDestino
      tags:
        - Destinos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearDestinoDto'
      responses:
        '201':
          description: Destino creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destino'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /destinos/{id}:
    get:
      summary: Obtener detalle de un destino por ID
      operationId: obtenerDestinoPorId
      tags:
        - Destinos
      parameters:
        - name: id
          in: path
          required: true
          description: ID del destino a consultar
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Detalle del destino.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destino'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /reservas:
    get:
      summary: Obtener lista de reservas
      operationId: listarReservas
      tags:
        - Reservas
      responses:
        '200':
          description: Lista de reservas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reserva'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    post:
      summary: Crear una nueva reserva de itinerario
      operationId: crearReserva
      tags:
        - Reservas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaDto'
      responses:
        '201':
          description: Reserva creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /reservas/{id}:
    get:
      summary: Obtener detalle de una reserva
      operationId: obtenerReservaPorId
      tags:
        - Reservas
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la reserva
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Detalle de la reserva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

components:

  schemas:

    Destino:
      type: object
      required:
        - id
        - nombre
        - descripcion
        - ubicacion
        - precioBase
        - fotosUrl
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: "Parque Nacional del Café"
        descripcion:
          type: string
          example: "Parque temático sobre la cultura cafetera colombiana."
        ubicacion:
          type: string
          example: "Montenegro, Quindío"
        precioBase:
          type: number
          format: double
          example: 85000.00
        fotosUrl:
          type: array
          items:
            type: string
          example: ["https://ejemplo.com/foto1.jpg", "https://ejemplo.com/foto2.jpg"]

    CrearDestinoDto:
      type: object
      required:
        - nombre
        - descripcion
        - ubicacion
        - precioBase
      properties:
        nombre:
          type: string
          example: "Valle del Cocora"
        descripcion:
          type: string
          example: "Paisaje natural icónico con palmas de cera."
        ubicacion:
          type: string
          example: "Salento, Quindío"
        precioBase:
          type: number
          format: double
          example: 50000.00
        fotosUrl:
          type: array
          items:
            type: string
          example: ["https://ejemplo.com/cocora.jpg"]

    Reserva:
      type: object
      required:
        - id
        - itinerarioId
        - fechaReserva
        - montoTotal
        - estadoPago
      properties:
        id:
          type: integer
          format: int64
          example: 101
        itinerarioId:
          type: integer
          format: int64
          example: 5
        fechaReserva:
          type: string
          format: date
          example: "2026-10-15"
        montoTotal:
          type: number
          format: double
          example: 250000.00
        estadoPago:
          type: string
          enum: [PENDIENTE, CONFIRMADA, CANCELADA]
          example: "CONFIRMADA"

    CrearReservaDto:
      type: object
      required:
        - itinerarioId
        - fechaReserva
        - montoTotal
      properties:
        itinerarioId:
          type: integer
          format: int64
          example: 5
        fechaReserva:
          type: string
          format: date
          example: "2026-10-15"
        montoTotal:
          type: number
          format: double
          example: 250000.00

    ApiError:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-10-02T11:42:00Z"
        status:
          type: integer
          example: 404
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "El recurso solicitado no fue encontrado."
        path:
          type: string
          example: "/api/v1/destinos/999"

  responses:

    PeticionInvalida:
      description: Petición inválida o datos faltantes (400 Bad Request)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    RecursoNoEncontrado:
      description: Recurso no encontrado (404 Not Found)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    ErrorInterno:
      description: Error interno del servidor (500 Internal Server Error)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
