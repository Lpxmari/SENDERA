openapi: 3.0.3
info:
  title: API REST - Proyecto SENDERA
  description: Contrato de interfaz OpenAPI para la integración entre Frontend (React + TS) y Backend (Spring Boot) del proyecto SENDERA.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Servidor de Desarrollo Local

security:
  - bearerAuth: []

paths:

  /destinos:
    get:
      summary: Obtener lista de destinos turísticos
      operationId: listarDestinos
      tags:
        - Destinos
      responses:
        '200':
          description: Lista de destinos obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Destino'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    post:
      summary: Crear un nuevo destino turístico
      operationId: crearDestino
      tags:
        - Destinos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearDestinoDto'
      responses:
        '201':
          description: Destino creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destino'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /destinos/{id}:
    get:
      summary: Obtener detalle de un destino por ID
      operationId: obtenerDestinoPorId
      tags:
        - Destinos
      parameters:
        - name: id
          in: path
          required: true
          description: ID del destino a consultar
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Detalle del destino.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destino'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /reservas:
    get:
      summary: Obtener lista de reservas
      operationId: listarReservas
      tags:
        - Reservas
      responses:
        '200':
          description: Lista de reservas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reserva'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    post:
      summary: Crear una nueva reserva de itinerario
      operationId: crearReserva
      tags:
        - Reservas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaDto'
      responses:
        '201':
          description: Reserva creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /reservas/{id}:
    get:
      summary: Obtener detalle de una reserva
      operationId: obtenerReservaPorId
      tags:
        - Reservas
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la reserva
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Detalle de la reserva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/registro:
    post:
      summary: Registrar un nuevo usuario
      operationId: registrarUsuario
      tags:
        - Autenticación
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroDto'
      responses:
        '201':
          description: Usuario creado. Devuelve el token de sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRespuesta'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/login:
    post:
      summary: Iniciar sesión
      operationId: iniciarSesion
      tags:
        - Autenticación
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Sesión iniciada. Devuelve el token JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRespuesta'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/recuperar-contrasena:
    post:
      summary: Solicitar el correo de recuperación de contraseña
      description: Responde 204 exista o no el correo, para no revelar qué cuentas están registradas.
      operationId: recuperarContrasena
      tags:
        - Autenticación
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarContrasenaDto'
      responses:
        '204':
          description: Solicitud procesada.
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/cambiar-contrasena:
    post:
      summary: Cambiar la contraseña con el token recibido por correo
      operationId: cambiarContrasena
      tags:
        - Autenticación
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarContrasenaDto'
      responses:
        '204':
          description: Contraseña actualizada.
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/me:
    get:
      summary: Obtener el usuario de la sesión actual
      operationId: perfilUsuario
      tags:
        - Autenticación
      responses:
        '200':
          description: Datos del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutorizado'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Destino:
      type: object
      required:
        - id
        - nombre
        - descripcion
        - ubicacion
        - precioBase
        - fotosUrl
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: "Parque Nacional del Café"
        descripcion:
          type: string
          example: "Parque temático sobre la cultura cafetera colombiana."
        ubicacion:
          type: string
          example: "Montenegro, Quindío"
        precioBase:
          type: number
          format: double
          example: 85000.00
        fotosUrl:
          type: array
          items:
            type: string
          example: ["https://ejemplo.com/foto1.jpg", "https://ejemplo.com/foto2.jpg"]

    CrearDestinoDto:
      type: object
      required:
        - nombre
        - descripcion
        - ubicacion
        - precioBase
      properties:
        nombre:
          type: string
          example: "Valle del Cocora"
        descripcion:
          type: string
          example: "Paisaje natural icónico con palmas de cera."
        ubicacion:
          type: string
          example: "Salento, Quindío"
        precioBase:
          type: number
          format: double
          example: 50000.00
        fotosUrl:
          type: array
          items:
            type: string
          example: ["https://ejemplo.com/cocora.jpg"]

    Reserva:
      type: object
      required:
        - id
        - itinerarioId
        - fechaReserva
        - montoTotal
        - estadoPago
      properties:
        id:
          type: integer
          format: int64
          example: 101
        itinerarioId:
          type: integer
          format: int64
          example: 5
        fechaReserva:
          type: string
          format: date
          example: "2026-10-15"
        montoTotal:
          type: number
          format: double
          example: 250000.00
        estadoPago:
          type: string
          enum: [PENDIENTE, CONFIRMADA, CANCELADA]
          example: "CONFIRMADA"

    CrearReservaDto:
      type: object
      required:
        - itinerarioId
        - fechaReserva
        - montoTotal
      properties:
        itinerarioId:
          type: integer
          format: int64
          example: 5
        fechaReserva:
          type: string
          format: date
          example: "2026-10-15"
        montoTotal:
          type: number
          format: double
          example: 250000.00

    Usuario:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: "María"
        apellidos:
          type: string
          example: "Gutiérrez"
        correo:
          type: string
          format: email
          example: "maria@correo.com"

    AuthRespuesta:
      type: object
      properties:
        token:
          type: string
          description: JWT que se envía como encabezado Authorization con el esquema Bearer.
        usuario:
          $ref: '#/components/schemas/Usuario'

    RegistroDto:
      type: object
      required: [nombre, apellidos, correo, contrasena]
      properties:
        nombre:
          type: string
          maxLength: 100
          example: "María"
        apellidos:
          type: string
          maxLength: 120
          example: "Gutiérrez"
        correo:
          type: string
          format: email
          example: "maria@correo.com"
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: Debe incluir letras y números.

    LoginDto:
      type: object
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string
          format: password

    RecuperarContrasenaDto:
      type: object
      required: [correo]
      properties:
        correo:
          type: string
          format: email

    CambiarContrasenaDto:
      type: object
      required: [token, nuevaContrasena]
      properties:
        token:
          type: string
          description: Token recibido en el enlace del correo.
        nuevaContrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 64

    ApiError:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-10-02T11:42:00Z"
        status:
          type: integer
          example: 404
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "El recurso solicitado no fue encontrado."
        path:
          type: string
          example: "/api/v1/destinos/999"

  responses:

    PeticionInvalida:
      description: Petición inválida o datos faltantes (400 Bad Request)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    RecursoNoEncontrado:
      description: Recurso no encontrado (404 Not Found)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    ErrorInterno:
      description: Error interno del servidor (500 Internal Server Error)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NoAutorizado:
      description: Credenciales incorrectas o sesión inválida/expirada (401 Unauthorized)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Conflicto:
      description: El recurso ya existe, por ejemplo un correo ya registrado (409 Conflict)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
