server:
  # Las plataformas de despliegue (Railway, etc.) inyectan PORT.
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: sendera-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  config:
    # Carga el archivo .env local (ignorado por Git) si existe; las variables de entorno reales tienen prioridad.
    import: optional:file:.env[.properties],optional:file:./sendera-backend/.env[.properties]
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sendera}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    # Lista separada por comas. En produccion define CORS_ORIGINS con el dominio real del frontend.
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    # Obligatorio, minimo 32 caracteres. Definelo en el entorno (JWT_SECRET); no lo guardes en el repositorio.
    secret: ${JWT_SECRET}
    expiracion-horas: ${JWT_EXPIRACION_HORAS:24}
  seguridad:
    login:
      # Límite de POST /auth/login (RNF de seguridad, OB-02): intentos por minuto por IP + correo y tope por IP.
      intentos-por-minuto: ${LOGIN_INTENTOS_POR_MINUTO:5}
      intentos-por-ip-por-minuto: ${LOGIN_INTENTOS_POR_IP_POR_MINUTO:20}
  recuperacion:
    expiracion-minutos: ${RECUPERACION_EXPIRACION_MINUTOS:15}
  pagos:
    # Mercado Pago Checkout Pro. Sin access-token la app arranca igual y el pago en línea responde 503.
    # Para pruebas (sandbox) usa el Access Token de prueba de "Tus integraciones"; nunca lo subas al repositorio.
    mercadopago:
      access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
      # Clave secreta de "Webhooks > Configurar notificaciones"; si se define, se exige la firma x-signature.
      webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
      # Opcional: URL HTTPS pública del webhook por preferencia. Los pagos de prueba solo notifican a la URL
      # configurada en "Tus integraciones", así que normalmente se deja vacía.
      notification-url: ${MERCADOPAGO_NOTIFICATION_URL:}
      api-url: ${MERCADOPAGO_API_URL:https://api.mercadopago.com}
  mail:
    remitente: ${MAIL_REMITENTE:no-reply@sendera.com}
    nombre-remitente: ${MAIL_NOMBRE_REMITENTE:Sendera}
    brevo-api-key: ${BREVO_API_KEY:}
    brevo-url: ${BREVO_API_URL:https://api.brevo.com/v3}
    smtp:
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:587}
      usuario: ${MAIL_USERNAME:}
      contrasena: ${MAIL_PASSWORD:}

# Actuator: solo se expone /actuator/health (sin detalles) para el chequeo de salud del despliegue.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # El correo es un servicio externo opcional: si el SMTP no esta configurado o cae, la app sigue
    # siendo util y no debe marcarse como caida (el healthcheck de Railway reiniciaria el servicio).
    mail:
      enabled: false
