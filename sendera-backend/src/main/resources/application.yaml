server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: sendera-backend
  datasource:
    url: jdbc:mysql://localhost:3307/sendera_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username:
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect