name: CI

# Integración continua de SENDERA (monorepo: sendera-backend + sendera-front).
# Debe vivir en la raíz del repositorio: GitHub solo lee .github/workflows/ de la raíz.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Una ejecución nueva sobre la misma rama cancela la anterior (ahorra minutos en los PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: 1. Backend (build, tests y cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sendera-backend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube necesita el historial para atribuir cambios

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      # check = compilar + pruebas (H2, perfil test: no necesita MySQL) + informe JaCoCo
      # + umbral mínimo de cobertura definido en build.gradle.
      - name: Compilar, probar y verificar cobertura
        run: ./gradlew check --console=plain

      - name: Generar el jar ejecutable
        run: ./gradlew bootJar --console=plain

      - name: Guardar informes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-informes
          path: |
            sendera-backend/build/reports/tests/test
            sendera-backend/build/reports/jacoco/test
          if-no-files-found: ignore
          retention-days: 14

      # SonarQube es opcional: solo corre si el repositorio tiene el secreto SONAR_TOKEN.
      # Variables del repositorio: SONAR_HOST_URL (o SonarCloud por defecto) y SONAR_PROJECT_KEY.
      - name: Análisis SonarQube
        if: env.SONAR_TOKEN != '' && github.event.pull_request.head.repo.fork != true
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: sendera-backend
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.host.url=${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=build/classes/java/main
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

  frontend:
    name: 2. Frontend (tipos, lint, pruebas y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sendera-front
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sendera-front/package-lock.json

      - name: Instalar dependencias (según package-lock.json)
        run: npm ci

      - name: Verificar tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Lint (oxlint)
        run: npm run lint

      - name: Pruebas (Vitest)
        run: npm test

      - name: Build de producción
        run: npm run build
        env:
          # En producción el frontend llama a la API por esta URL (ver sendera-front/.env.example)
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api/v1' }}

      - name: Guardar el build del frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: sendera-front/dist
          retention-days: 14

  # El CD solo corre al integrar en main (merge de PR); los pull requests nunca llegan aquí.
  cd:
    name: CD
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd.yaml
    secrets: inherit
