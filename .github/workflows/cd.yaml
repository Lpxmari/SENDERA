name: CD

# Despliegue continuo del backend en Railway. Lo invoca el CI (workflow_call) solo tras un push a main
# cuyo backend y frontend ya pasaron todas las comprobaciones. Se usa workflow_call y no workflow_run
# para no ejecutar código de forks con acceso a los secretos de despliegue.
#
# Configuración necesaria en GitHub (Settings > Secrets and variables > Actions):
#   secrets.RAILWAY_TOKEN        token de proyecto de Railway
#   secrets.RAILWAY_SERVICE_ID   id del servicio del backend en Railway
#   vars.APP_URL                 URL pública del backend, sin barra final (ej. https://sendera-api.up.railway.app)
# Y en Railway, variables del servicio (nunca en el repositorio): DB_HOST, DB_PORT, DB_NAME, DB_USER,
#   DB_PASSWORD, JWT_SECRET (32+ caracteres), CORS_ORIGINS (dominio real del frontend), FRONTEND_URL,
#   y las SPRING_MAIL_* si se envían correos. Ver docs/11-ci-cd.md.
on:
  workflow_call:

permissions:
  contents: read

# Nunca dos despliegues a la vez: el segundo espera al primero.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  deploy:
    name: 3. Desplegar backend en Railway
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    container: ghcr.io/railwayapp/cli:5.63.4
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - name: Descargar el commit que pasó el CI
        uses: actions/checkout@v4

      - name: Comprobar la configuración del despliegue
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "Faltan los secretos RAILWAY_TOKEN y/o RAILWAY_SERVICE_ID (ver docs/11-ci-cd.md)."
            exit 1
          fi

      # Solo se sube la carpeta del backend: el repositorio tiene también el frontend.
      - name: Desplegar
        working-directory: sendera-backend
        run: railway up --service="$RAILWAY_SERVICE_ID" --ci

  smoke-test:
    name: 4. Prueba de humo (health y API)
    needs: deploy
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Esperar a que la app responda en /actuator/health
        run: |
          if [ -z "$APP_URL" ]; then echo "Falta la variable APP_URL"; exit 1; fi
          for i in $(seq 1 20); do
            if curl -fsS "$APP_URL/api/v1/actuator/health" | grep -q '"status":"UP"'; then
              echo "La app está arriba"
              exit 0
            fi
            echo "Intento $i: aún no responde, esperando 15 s..."
            sleep 15
          done
          echo "La app no respondió con estado UP"
          exit 1

      - name: Verificar que la API pública responde
        run: curl -fsS "$APP_URL/api/v1/destinos" > /dev/null

      - name: Verificar que la parte protegida sigue cerrada
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/api/v1/admin/usuarios")
          if [ "$codigo" != "401" ]; then
            echo "Se esperaba 401 sin token en /admin/usuarios y se obtuvo $codigo"
            exit 1
          fi
